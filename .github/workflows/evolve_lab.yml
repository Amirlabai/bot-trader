name: Evolve Lab (weekly proposals)

on:
  schedule:
    - cron: '0 3 * * 0'   # Sundays 03:00 UTC, after the weekly candle closes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - run: pip install -r requirements.txt
    - name: Run lab (proposals only, never promotes)
      run: python scratch/evolve_lab/weekly.py
    - name: Commit decision log
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/evolution_log.json
        git diff --cached --quiet || (git commit -m "Lab: weekly proposals" && git pull --rebase && git push)
