<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Bot Trader Dashboard</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --success-color: #3fb950;
            --danger-color: #f85149;
            --warning-color: #d29922;
            --header-bg: #21262d;
            --muted: #8b949e;
            --page-pad: 20px;
            --chart-h: 380px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: max(var(--page-pad), env(safe-area-inset-top))
                max(var(--page-pad), env(safe-area-inset-right))
                max(var(--page-pad), env(safe-area-inset-bottom))
                max(var(--page-pad), env(safe-area-inset-left));
            overflow-x: clip;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            min-width: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        header > div:last-child {
            flex-shrink: 0;
        }

        h1 {
            color: var(--accent-color);
            margin: 0;
            font-size: clamp(1.35rem, 4vw, 2rem);
            line-height: 1.2;
        }

        select,
        input {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 16px;
            max-width: 100%;
        }

        #strategy-selector {
            min-height: 44px;
        }

        #symbol-filter {
            min-height: 44px;
            width: min(240px, 100%);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            min-width: 0;
            overflow: hidden;
        }

        .card-title {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-value {
            font-size: 24px;
            font-weight: 600;
            color: #f0f6fc;
        }

        .main-charts {
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: auto auto;
            gap: 20px;
            margin-bottom: 30px;
            align-items: stretch;
        }

        .chart-equity {
            grid-column: 1;
            grid-row: 1;
        }

        .chart-exposure {
            grid-column: 2;
            grid-row: 1;
        }

        .pair-perf-row {
            grid-column: 1 / -1;
            grid-row: 2;
        }

        .chart-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            height: var(--chart-h);
            min-width: 0;
        }

        .table-scroll {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            margin-top: 15px;
        }

        .table-scroll table {
            margin-top: 0;
            min-width: 560px;
        }

        .pair-perf-card .table-scroll {
            margin-top: 0;
        }

        .pair-perf-card .table-scroll table {
            min-width: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }

        th,
        td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            padding: 3px 7px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
        }

        .badge-long {
            background: rgba(59, 190, 80, 0.15);
            color: var(--success-color);
        }

        .badge-short {
            background: rgba(248, 81, 73, 0.15);
            color: var(--danger-color);
        }

        .loader {
            text-align: center;
            padding: 50px;
            color: var(--muted);
        }

        .trade-row {
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
        }

        .trade-row:hover {
            background: rgba(88, 166, 255, 0.06);
        }

        .trade-row td.caret-cell {
            width: 28px;
            color: var(--muted);
            font-size: 10px;
        }

        .trade-row td.caret-cell .caret {
            display: inline-block;
            transition: transform 0.2s;
        }

        .trade-row.expanded td.caret-cell .caret {
            transform: rotate(90deg);
        }

        .trade-detail-row td {
            padding: 0;
            border-bottom: none;
        }

        .trade-detail-inner {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s ease;
            background: #0d1117;
            border-bottom: 1px solid var(--border-color);
        }

        .trade-detail-inner.open {
            max-height: 700px;
            padding: 20px;
        }

        .trade-chart-img {
            display: block;
            max-width: 100%;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin: 0 auto;
        }

        .no-chart-msg {
            color: var(--muted);
            font-size: 12px;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }

        .trade-chart-caption {
            font-size: 12px;
            color: var(--muted);
            margin: 0 0 12px;
        }

        .trade-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px 16px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
        }

        .trade-summary dt {
            color: var(--muted);
            margin: 0;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .trade-summary dd {
            margin: 2px 0 0 0;
            color: #f0f6fc;
            font-weight: 500;
        }

        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .filter-bar > div:last-child {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            justify-content: flex-end;
        }

        .pos-pnl-bar {
            height: 6px;
            background: #30363d;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }

        .pos-pnl-fill {
            height: 100%;
        }

        .pair-perf-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .pair-perf-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            min-width: 0;
        }

        .pair-perf-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
        }

        .pair-perf-header .card-title {
            margin-bottom: 0;
        }

        .pair-perf-window {
            font-size: 11px;
            color: var(--muted);
        }

        .pair-perf-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .pair-perf-table th {
            color: var(--muted);
            font-size: 10px;
            text-transform: uppercase;
            padding: 6px 8px 6px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .pair-perf-table td {
            padding: 8px 8px 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .pair-perf-table tr:last-child td {
            border-bottom: none;
        }

        .pair-perf-empty {
            color: var(--muted);
            font-size: 12px;
            padding: 8px 0;
        }

        @media (max-width: 900px) {
            .main-charts {
                grid-template-columns: 1fr;
            }

            .chart-equity {
                grid-row: 1;
            }

            .chart-exposure {
                grid-column: 1;
                grid-row: 2;
            }

            .pair-perf-row {
                grid-column: 1;
                grid-row: 3;
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 720px) {
            :root {
                --page-pad: 12px;
                --chart-h: 260px;
            }

            header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                margin-bottom: 20px;
                padding-bottom: 16px;
            }

            header > div:last-child {
                width: 100%;
            }

            #strategy-selector {
                width: 100%;
            }

            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                margin-bottom: 20px;
            }

            .card {
                padding: 12px;
            }

            .card-value {
                font-size: 20px;
            }

            .chart-container {
                padding: 14px;
            }

            .main-charts {
                gap: 12px;
                margin-bottom: 20px;
            }

            .filter-bar > div:last-child {
                justify-content: stretch;
                width: 100%;
            }

            #symbol-filter {
                width: 100%;
            }

            /* Keep glanceable columns; details live in the expand panel */
            .history-table .col-secondary,
            .positions-table .col-secondary {
                display: none;
            }

            .table-scroll table.history-table,
            .table-scroll table.positions-table {
                min-width: 0;
            }

            th,
            td {
                padding: 10px 8px;
            }

            .trade-row {
                min-height: 48px;
            }
        }

        @media (max-width: 380px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        @media (pointer: coarse) {
            .trade-row td {
                padding-top: 12px;
                padding-bottom: 12px;
            }
        }
    </style>
    <script src="report_data.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <div>
                <h1>Bot Trader <span style="font-weight:300; opacity:0.7">Insights</span></h1>
                <div id="last-updated" style="font-size: 11px; color: var(--muted); margin-top: 4px;">Loading...</div>
            </div>
            <div>
                <select id="strategy-selector" onchange="renderStrategy(this.value)">
                    <option value="">Loading Strategies...</option>
                </select>
            </div>
        </header>

        <div id="dashboard-content" style="display:none;">
            <!-- Performance Highlights -->
            <div class="grid">
                <div class="card">
                    <div class="card-title">Net Equity</div>
                    <div class="card-value" id="val-equity">---</div>
                </div>
                <div class="card">
                    <div class="card-title">Win Rate</div>
                    <div class="card-value" id="val-winrate">---</div>
                </div>
                <div class="card">
                    <div class="card-title">Profit Factor</div>
                    <div class="card-value" id="val-profitfactor">---</div>
                </div>
                <div class="card">
                    <div class="card-title">Max Drawdown</div>
                    <div class="card-value" id="val-drawdown" style="color:var(--danger-color)">---</div>
                </div>
                <div class="card">
                    <div class="card-title">Total Trades</div>
                    <div class="card-value" id="val-total-trades">---</div>
                </div>
            </div>

            <!-- Charts Section -->
            <div class="main-charts">
                <div class="chart-container chart-equity">
                    <div style="font-size:12px; color:var(--muted); margin-bottom:10px; text-transform:uppercase;">
                        Equity Growth (vs. Baseline)</div>
                    <canvas id="equityChart"></canvas>
                </div>
                <div class="chart-container chart-exposure">
                    <div style="font-size:12px; color:var(--muted); margin-bottom:10px; text-transform:uppercase;">Asset
                        Exposure</div>
                    <canvas id="exposureChart"></canvas>
                </div>
                <div class="pair-perf-row" id="pair-performance-container">
                    <div class="pair-perf-card">
                        <div class="pair-perf-header">
                            <div class="card-title">Rolling winners</div>
                            <span class="pair-perf-window" id="pair-perf-window"></span>
                        </div>
                        <div id="pair-winners-container"></div>
                    </div>
                    <div class="pair-perf-card">
                        <div class="pair-perf-header">
                            <div class="card-title">Rolling losers</div>
                        </div>
                        <div id="pair-losers-container"></div>
                    </div>
                </div>
            </div>

            <!-- Active Positions -->
            <div class="card">
                <div class="card-title">Open Positions</div>
                <div id="positions-table-container"></div>
            </div>

            <br>

            <!-- Trade History with Filtering -->
            <div class="card">
                <div class="filter-bar">
                    <div class="card-title" style="margin-bottom:0">Closed Trades History</div>
                    <div>
                        <input type="text" id="symbol-filter" placeholder="Filter by symbol..."
                            onkeyup="applyFilters()">
                    </div>
                </div>
                <div id="history-table-container"></div>
            </div>
        </div>

        <div id="loader" class="loader">Waking up the bot...</div>
    </div>

    <script>
        let rawData = null;
        let equityChart = null;
        let exposureChart = null;
        let currentStrategy = null;
        let expandedRow = null;
        let expandedTradeRow = null;

        async function loadData() {
            try {
                if (typeof window.REPORT_DATA === 'undefined') {
                    throw new Error("Data not found. Running from a local file? Use update_snapshots.py first.");
                }
                rawData = window.REPORT_DATA;
                document.getElementById('last-updated').innerText = `Sync: ${new Date(rawData.metadata.last_updated).toLocaleString()}`;

                const selector = document.getElementById('strategy-selector');
                selector.innerHTML = '';
                const strategies = Object.keys(rawData.strategies);
                strategies.forEach(strat => {
                    const opt = document.createElement('option');
                    opt.value = strat;
                    opt.innerText = strat.replace(/_/g, ' ').toUpperCase();
                    selector.appendChild(opt);
                });

                renderStrategy(strategies[0]);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('dashboard-content').style.display = 'block';
            } catch (error) {
                document.getElementById('loader').innerHTML = `<div style="color:var(--danger-color)">${error.message}</div>`;
            }
        }

        function fmtPrice(v) {
            if (v == null || v === undefined || v <= 0) return '-';
            return '$' + Number(v).toFixed(4);
        }

        function fmtDate(d) {
            if (!d) return '-';
            const parsed = new Date(d.length === 10 ? d + 'T00:00:00' : d);
            if (isNaN(parsed.getTime())) return d;
            return parsed.toLocaleDateString();
        }

        function daysHeld(t) {
            if (t.hold_days != null && t.hold_days !== undefined) return t.hold_days;
            const entry = t.entry_date;
            const exit = t.exit_date || (t.time ? String(t.time).slice(0, 10) : '');
            if (!entry || !exit) return null;
            const entryDt = new Date(entry.length === 10 ? entry + 'T00:00:00' : entry);
            const exitDt = new Date(exit.length === 10 ? exit + 'T00:00:00' : exit);
            if (isNaN(entryDt.getTime()) || isNaN(exitDt.getTime())) return null;
            return Math.max(0, Math.round((exitDt - entryDt) / 86400000));
        }

        function formatReason(t) {
            let r = t.reason || '-';
            if (t.exit_kind === 'tp1_partial' && t.quantity_pct != null && t.quantity_pct < 1) {
                const pct = Math.round(t.quantity_pct * 100);
                if (!r.includes('%')) r += ` · ${pct}%`;
            }
            return r;
        }

        function tradeSummaryHtml(t) {
            const held = daysHeld(t);
            const heldStr = held != null ? ` <span style="color:var(--muted); font-weight:400">(${held}d)</span>` : '';
            const sl = t.stop_loss_at_exit != null ? t.stop_loss_at_exit : t.stop_loss;
            const tp = t.take_profit_at_exit != null ? t.take_profit_at_exit : t.take_profit;
            const slLabel = 'SL at exit';
            const tpLabel = t.exit_kind === 'tp1_partial' ? 'TP1 target' : 'Take profit';
            const tpRow = (t.exit_kind === 'tp1_partial' && tp > 0)
                ? `<div><dt>${tpLabel}</dt><dd>${fmtPrice(tp)}</dd></div>`
                : (tp > 0 ? `<div><dt>${tpLabel}</dt><dd>${fmtPrice(tp)}</dd></div>` : '');
            return `<dl class="trade-summary">
                <div><dt>Entry</dt><dd>${fmtPrice(t.entry_price)} <span style="color:var(--muted); font-weight:400">${fmtDate(t.entry_date)}</span></dd></div>
                <div><dt>Exit</dt><dd>${fmtPrice(t.exit_price)} <span style="color:var(--muted); font-weight:400">${fmtDate(t.exit_date || t.time)}</span>${heldStr}</dd></div>
                <div><dt>${slLabel}</dt><dd>${fmtPrice(sl)}</dd></div>
                ${tpRow}
                <div><dt>Quantity</dt><dd>${t.qty != null ? t.qty.toFixed(6) : '-'}</dd></div>
                <div><dt>Reason</dt><dd>${formatReason(t)}</dd></div>
            </dl>`;
        }

        function computePairPerformance(trades, days = 30, minTrades = 50, topN = 5) {
            if (!trades || trades.length === 0) {
                return { winners: [], losers: [], window_label: 'No closed trades', trades_in_window: 0 };
            }
            const chrono = [...trades].sort((a, b) => new Date(a.time) - new Date(b.time));
            const latest = new Date(chrono[chrono.length - 1].time);
            const cutoff = new Date(latest);
            cutoff.setDate(cutoff.getDate() - days);
            let rolling = chrono.filter(t => new Date(t.time) >= cutoff);
            if (rolling.length < minTrades) {
                rolling = chrono.slice(-minTrades);
            }
            const bySymbol = {};
            rolling.forEach(t => {
                if (!bySymbol[t.symbol]) {
                    bySymbol[t.symbol] = { symbol: t.symbol, pnl: 0, trades: 0, wins: 0 };
                }
                bySymbol[t.symbol].pnl += t.pnl;
                bySymbol[t.symbol].trades += 1;
                if (t.pnl > 0) bySymbol[t.symbol].wins += 1;
            });
            const rows = Object.values(bySymbol).map(d => ({
                symbol: d.symbol,
                pnl: d.pnl,
                trades: d.trades,
                win_rate: d.trades ? (d.wins / d.trades) * 100 : 0
            }));
            rows.sort((a, b) => b.pnl - a.pnl);
            const winners = rows.filter(r => r.pnl > 0).slice(0, topN);
            const losers = rows.filter(r => r.pnl < 0).sort((a, b) => a.pnl - b.pnl).slice(0, topN);
            let windowLabel = `Last ${days} days (${rolling.length} trades)`;
            if (rolling.length >= minTrades && new Date(rolling[0].time) < cutoff) {
                windowLabel = `Last ${rolling.length} closed trades`;
            }
            return { winners, losers, window_label: windowLabel, trades_in_window: rolling.length };
        }

        function renderPairPerfTable(containerId, rows, positive) {
            const container = document.getElementById(containerId);
            if (!rows || rows.length === 0) {
                container.innerHTML = `<div class="pair-perf-empty">No ${positive ? 'winning' : 'losing'} pairs in this window.</div>`;
                return;
            }
            const body = rows.map(r => {
                const pnlColor = r.pnl >= 0 ? 'var(--success-color)' : 'var(--danger-color)';
                return `<tr>
                    <td style="font-weight:600">${r.symbol}</td>
                    <td style="color:${pnlColor}; font-weight:600">${r.pnl >= 0 ? '+' : ''}$${r.pnl.toFixed(2)}</td>
                    <td style="color:var(--muted)">${r.trades}</td>
                    <td style="color:var(--muted)">${r.win_rate.toFixed(1)}%</td>
                </tr>`;
            }).join('');
            container.innerHTML = `<div class="table-scroll"><table class="pair-perf-table">
                <thead><tr><th>Pair</th><th>Realized P/L</th><th>Trades</th><th>Win %</th></tr></thead>
                <tbody>${body}</tbody>
            </table></div>`;
        }

        function renderPairPerformance(data) {
            const perf = data.pair_performance || computePairPerformance(data.trade_history);
            document.getElementById('pair-perf-window').innerText = perf.window_label || '';
            renderPairPerfTable('pair-winners-container', perf.winners, true);
            renderPairPerfTable('pair-losers-container', perf.losers, false);
        }

        function renderStrategy(strategyName) {
            currentStrategy = strategyName;
            expandedRow = null;
            expandedTradeRow = null;
            const data = rawData.strategies[strategyName];
            if (!data) return;

            renderPairPerformance(data);

            // Metrics
            document.getElementById('val-equity').innerText = `$${data.current_equity.toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
            document.getElementById('val-winrate').innerText = `${data.metrics.win_rate.toFixed(1)}%`;
            const pf = data.metrics.profit_factor;
            document.getElementById('val-profitfactor').innerText = (typeof pf === 'number') ? pf.toFixed(2) : pf;
            document.getElementById('val-drawdown').innerText = `-${data.metrics.max_drawdown.toFixed(1)}%`;
            document.getElementById('val-total-trades').innerText = data.metrics.total_trades;

            // Tables
            renderPositions(data.active_positions);
            renderHistory();

            // Charts
            renderEquityChart(data.equity_curve);
            renderExposureChart(data.exposure);
        }

        function renderPositions(positions) {
            const container = document.getElementById('positions-table-container');
            if (positions.length === 0) {
                container.innerHTML = '<div style="padding:20px; color:var(--muted); text-align:center;">Wallet is empty. No risk on table.</div>';
                return;
            }

            let rows = positions.map(p => {
                const badge = p.side === 'LONG' ? 'badge-long' : 'badge-short';
                const pnl = p.unrealized_pnl || 0;
                const costBasis = p.qty * p.entry;
                const pnlPct = costBasis > 0 ? (pnl / costBasis) * 100 : 0;
                const pnlColor = pnl >= 0 ? 'var(--success-color)' : 'var(--danger-color)';
                const tp1Badge = p.tp1 ? '<span class="badge" style="background:rgba(210,153,34,0.1); color:var(--warning-color)">TP1 HIT</span>' : '';

                return `
                    <tr>
                        <td style="font-weight:600">${p.symbol} ${tp1Badge}</td>
                        <td><span class="badge ${badge}">${p.side}</span></td>
                        <td class="col-secondary">${p.qty.toFixed(6)}</td>
                        <td class="col-secondary">$${p.entry.toFixed(4)}</td>
                        <td class="col-secondary" style="color:var(--muted)">${fmtDate(p.entry_date)}</td>
                        <td class="col-secondary">$${(p.current_price || p.entry).toFixed(4)}</td>
                        <td style="color:${pnlColor}; font-weight:600">
                            ${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}
                            <div style="font-size:10px; opacity:0.8">${pnlPct.toFixed(2)}%</div>
                        </td>
                        <td class="col-secondary">$${p.sl > 0 ? p.sl.toFixed(4) : '-'}</td>
                        <td>$${p.value.toLocaleString()}</td>
                    </tr>`;
            }).join('');

            container.innerHTML = `
                <div class="table-scroll">
                <table class="positions-table">
                    <thead>
                        <tr>
                            <th>Asset</th><th>Side</th><th class="col-secondary">Size</th><th class="col-secondary">Entry</th><th class="col-secondary">Entry date</th><th class="col-secondary">Price</th><th>Unrealized P/L</th><th class="col-secondary">Stop</th><th>Market value</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
                </div>`;
        }

        function renderHistory() {
            applyFilters();
        }

        function applyFilters() {
            expandedRow = null;
            expandedTradeRow = null;
            const container = document.getElementById('history-table-container');
            if (!rawData?.strategies?.[currentStrategy]) {
                container.innerHTML = '<div style="padding:20px; color:var(--muted); text-align:center;">No strategy selected.</div>';
                return;
            }
            const filterText = document.getElementById('symbol-filter').value.toUpperCase();
            const data = rawData.strategies[currentStrategy];
            const filtered = data.trade_history.filter(t => t.symbol.toUpperCase().includes(filterText));

            if (filtered.length === 0) {
                container.innerHTML = '<div style="padding:20px; color:var(--muted); text-align:center;">No trades match your filter.</div>';
                return;
            }

            const tbody = document.createElement('tbody');
            filtered.forEach(t => {
                const badge = t.side === 'LONG' ? 'badge-long' : 'badge-short';
                const pnlColor = t.pnl >= 0 ? 'var(--success-color)' : 'var(--danger-color)';
                const hasChart = t.chart_b64 && t.chart_b64.length > 0;

                const tr = document.createElement('tr');
                tr.className = 'trade-row';
                const held = daysHeld(t);
                tr.innerHTML = `
                    <td class="caret-cell"><span class="caret">&#9654;</span></td>
                    <td style="color:var(--muted)">${fmtDate(t.exit_date || t.time)}</td>
                    <td class="col-secondary" style="color:var(--muted)">${fmtDate(t.entry_date)}</td>
                    <td class="col-secondary" style="color:var(--muted)">${held != null ? held : '-'}</td>
                    <td style="font-weight:600">${t.symbol}</td>
                    <td><span class="badge ${badge}">${t.side}</span></td>
                    <td class="col-secondary" style="color:var(--muted)">${fmtPrice(t.entry_price)}</td>
                    <td class="col-secondary" style="color:var(--muted)">${fmtPrice(t.exit_price)}</td>
                    <td class="col-secondary" style="color:var(--muted)">${t.qty != null ? t.qty.toFixed(4) : '-'}</td>
                    <td style="color:${pnlColor}">
                        ${t.pnl >= 0 ? '+' : ''}$${t.pnl.toFixed(2)}
                        <span style="font-size:10px; opacity:0.7">(${t.pnl_pct.toFixed(2)}%)</span>
                    </td>
                    <td class="col-secondary" style="font-size:11px; opacity:0.8">${formatReason(t)}</td>`;

                const detailTr = document.createElement('tr');
                detailTr.className = 'trade-detail-row';
                const inner = document.createElement('div');
                inner.className = 'trade-detail-inner';

                let detailBody = tradeSummaryHtml(t);
                if (hasChart) {
                    detailBody += `<img src="data:image/png;base64,${t.chart_b64}" class="trade-chart-img">`;
                } else {
                    detailBody += `<div class="no-chart-msg">Close snapshot missing. Re-run snapshot backfill or wait for the next daily close.</div>`;
                }
                inner.innerHTML = detailBody;

                detailTr.innerHTML = `<td colspan="11"></td>`;
                detailTr.querySelector('td').appendChild(inner);

                tr.onclick = () => {
                    if (expandedRow && expandedRow !== inner) {
                        expandedRow.classList.remove('open');
                        if (expandedTradeRow) expandedTradeRow.classList.remove('expanded');
                    }
                    inner.classList.toggle('open');
                    tr.classList.toggle('expanded');
                    const isOpen = inner.classList.contains('open');
                    expandedRow = isOpen ? inner : null;
                    expandedTradeRow = isOpen ? tr : null;
                };

                tbody.appendChild(tr);
                tbody.appendChild(detailTr);
            });

            container.innerHTML = '';
            const scroll = document.createElement('div');
            scroll.className = 'table-scroll';
            const table = document.createElement('table');
            table.className = 'history-table';
            table.innerHTML = `<thead><tr><th></th><th>Exit</th><th class="col-secondary">Entry date</th><th class="col-secondary">Days</th><th>Symbol</th><th>Side</th><th class="col-secondary">Entry</th><th class="col-secondary">Exit</th><th class="col-secondary">Qty</th><th>Realized P/L</th><th class="col-secondary">Signal Reason</th></tr></thead>`;
            table.appendChild(tbody);
            scroll.appendChild(table);
            container.appendChild(scroll);
        }

        function renderEquityChart(history) {
            const ctx = document.getElementById('equityChart').getContext('2d');
            if (equityChart) equityChart.destroy();

            const labels = history.map(h => new Date(h.time).toLocaleDateString());
            const values = history.map(h => h.equity);
            const initialPoint = history.find(h => h.type === 'initial');
            // Prefer curve "initial" point, then report metadata; 10000 is legacy fallback only
            const baseline = initialPoint?.equity ?? rawData.metadata?.initial_cash ?? history[0]?.equity ?? 10000;

            equityChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Equity',
                        data: values,
                        borderColor: '#58a6ff',
                        backgroundColor: 'rgba(88, 166, 255, 0.05)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 0
                    }, {
                        label: 'Initial',
                        data: Array(labels.length).fill(baseline),
                        borderColor: 'rgba(139, 148, 158, 0.5)',
                        borderWidth: 1,
                        borderDash: [5, 5],
                        pointRadius: 0,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#8b949e', maxTicksLimit: window.innerWidth < 720 ? 4 : 10 } },
                        y: { grid: { color: '#30363d' }, ticks: { color: '#8b949e' } }
                    }
                }
            });
        }

        function renderExposureChart(exposure) {
            const ctx = document.getElementById('exposureChart').getContext('2d');
            if (exposureChart) exposureChart.destroy();

            const labels = Object.keys(exposure);
            const values = Object.values(exposure);

            exposureChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: '#58a6ff',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#30363d' }, ticks: { color: '#8b949e' } },
                        y: { grid: { display: false }, ticks: { color: '#8b949e' } }
                    }
                }
            });
        }

        loadData();
    </script>
</body>

</html>
