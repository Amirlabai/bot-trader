<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Trader Dashboard</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --success-color: #3fb950;
            --danger-color: #f85149;
            --warning-color: #d29922;
            --header-bg: #21262d;
            --muted: #8b949e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--accent-color);
            margin: 0;
        }

        select,
        input {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
        }

        .card-title {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-value {
            font-size: 24px;
            font-weight: 600;
            color: #f0f6fc;
        }

        .main-charts {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            height: 380px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }

        th,
        td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            padding: 3px 7px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
        }

        .badge-long {
            background: rgba(59, 190, 80, 0.15);
            color: var(--success-color);
        }

        .badge-short {
            background: rgba(248, 81, 73, 0.15);
            color: var(--danger-color);
        }

        .loader {
            text-align: center;
            padding: 50px;
            color: var(--muted);
        }

        .trade-row {
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
        }

        .trade-row:hover {
            background: rgba(88, 166, 255, 0.06);
        }

        .trade-row td.caret-cell {
            width: 20px;
            color: var(--muted);
            font-size: 10px;
            transition: transform 0.2s;
        }

        .trade-row.expanded td.caret-cell {
            transform: rotate(90deg);
            display: inline-block;
        }

        .trade-detail-row td {
            padding: 0;
            border-bottom: none;
        }

        .trade-detail-inner {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s ease;
            background: #0d1117;
            border-bottom: 1px solid var(--border-color);
        }

        .trade-detail-inner.open {
            max-height: 700px;
            padding: 20px;
        }

        .trade-chart-img {
            display: block;
            max-width: 100%;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin: 0 auto;
        }

        .no-chart-msg {
            color: var(--muted);
            font-size: 12px;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }

        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .pos-pnl-bar {
            height: 6px;
            background: #30363d;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }

        .pos-pnl-fill {
            height: 100%;
        }

        @media (max-width: 900px) {
            .main-charts {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script src="report_data.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <div>
                <h1>Bot Trader <span style="font-weight:300; opacity:0.7">Insights</span></h1>
                <div id="last-updated" style="font-size: 11px; color: var(--muted); margin-top: 4px;">Loading...</div>
            </div>
            <div>
                <select id="strategy-selector" onchange="renderStrategy(this.value)">
                    <option value="">Loading Strategies...</option>
                </select>
            </div>
        </header>

        <div id="dashboard-content" style="display:none;">
            <!-- Performance Highlights -->
            <div class="grid">
                <div class="card">
                    <div class="card-title">Net Equity</div>
                    <div class="card-value" id="val-equity">---</div>
                </div>
                <div class="card">
                    <div class="card-title">Win Rate</div>
                    <div class="card-value" id="val-winrate">---</div>
                </div>
                <div class="card">
                    <div class="card-title">Profit Factor</div>
                    <div class="card-value" id="val-profitfactor">---</div>
                </div>
                <div class="card">
                    <div class="card-title">Max Drawdown</div>
                    <div class="card-value" id="val-drawdown" style="color:var(--danger-color)">---</div>
                </div>
                <div class="card">
                    <div class="card-title">Total Trades</div>
                    <div class="card-value" id="val-total-trades">---</div>
                </div>
            </div>

            <!-- Charts Section -->
            <div class="main-charts">
                <div class="chart-container">
                    <div style="font-size:12px; color:var(--muted); margin-bottom:10px; text-transform:uppercase;">
                        Equity Growth (vs. Baseline)</div>
                    <canvas id="equityChart"></canvas>
                </div>
                <div class="chart-container">
                    <div style="font-size:12px; color:var(--muted); margin-bottom:10px; text-transform:uppercase;">Asset
                        Exposure</div>
                    <canvas id="exposureChart"></canvas>
                </div>
            </div>

            <!-- Active Positions -->
            <div class="card">
                <div class="card-title">Open Positions</div>
                <div id="positions-table-container"></div>
            </div>

            <br>

            <!-- Trade History with Filtering -->
            <div class="card">
                <div class="filter-bar">
                    <div class="card-title" style="margin-bottom:0">Closed Trades History</div>
                    <div>
                        <input type="text" id="symbol-filter" placeholder="Filter by symbol..."
                            onkeyup="applyFilters()">
                    </div>
                </div>
                <div id="history-table-container"></div>
            </div>
        </div>

        <div id="loader" class="loader">Waking up the bot...</div>
    </div>

    <script>
        let rawData = null;
        let equityChart = null;
        let exposureChart = null;
        let currentStrategy = null;
        let expandedRow = null;
        let expandedTradeRow = null;

        async function loadData() {
            try {
                if (typeof window.REPORT_DATA === 'undefined') {
                    throw new Error("Data not found. Running from a local file? Use update_snapshots.py first.");
                }
                rawData = window.REPORT_DATA;
                document.getElementById('last-updated').innerText = `Sync: ${new Date(rawData.metadata.last_updated).toLocaleString()}`;

                const selector = document.getElementById('strategy-selector');
                selector.innerHTML = '';
                const strategies = Object.keys(rawData.strategies);
                strategies.forEach(strat => {
                    const opt = document.createElement('option');
                    opt.value = strat;
                    opt.innerText = strat.replace(/_/g, ' ').toUpperCase();
                    selector.appendChild(opt);
                });

                renderStrategy(strategies[0]);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('dashboard-content').style.display = 'block';
            } catch (error) {
                document.getElementById('loader').innerHTML = `<div style="color:var(--danger-color)">${error.message}</div>`;
            }
        }

        function renderStrategy(strategyName) {
            currentStrategy = strategyName;
            const data = rawData.strategies[strategyName];
            if (!data) return;

            // Metrics
            document.getElementById('val-equity').innerText = `$${data.current_equity.toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
            document.getElementById('val-winrate').innerText = `${data.metrics.win_rate.toFixed(1)}%`;
            const pf = data.metrics.profit_factor;
            document.getElementById('val-profitfactor').innerText = (typeof pf === 'number') ? pf.toFixed(2) : pf;
            document.getElementById('val-drawdown').innerText = `-${data.metrics.max_drawdown.toFixed(1)}%`;
            document.getElementById('val-total-trades').innerText = data.metrics.total_trades;

            // Tables
            renderPositions(data.active_positions);
            renderHistory(data.trade_history);

            // Charts
            renderEquityChart(data.equity_curve);
            renderExposureChart(data.exposure);
        }

        function renderPositions(positions) {
            const container = document.getElementById('positions-table-container');
            if (positions.length === 0) {
                container.innerHTML = '<div style="padding:20px; color:var(--muted); text-align:center;">Wallet is empty. No risk on table.</div>';
                return;
            }

            let rows = positions.map(p => {
                const badge = p.side === 'LONG' ? 'badge-long' : 'badge-short';
                const pnl = p.unrealized_pnl || 0;
                const costBasis = p.qty * p.entry;
                const pnlPct = costBasis > 0 ? (pnl / costBasis) * 100 : 0;
                const pnlColor = pnl >= 0 ? 'var(--success-color)' : 'var(--danger-color)';
                const tp1Badge = p.tp1 ? '<span class="badge" style="background:rgba(210,153,34,0.1); color:var(--warning-color)">TP1 HIT</span>' : '';

                return `
                    <tr>
                        <td style="font-weight:600">${p.symbol} ${tp1Badge}</td>
                        <td><span class="badge ${badge}">${p.side}</span></td>
                        <td>${p.qty.toFixed(6)}</td>
                        <td>$${p.entry.toFixed(4)}</td>
                        <td>$${(p.current_price || p.entry).toFixed(4)}</td>
                        <td style="color:${pnlColor}; font-weight:600">
                            ${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}
                            <div style="font-size:10px; opacity:0.8">${pnlPct.toFixed(2)}%</div>
                        </td>
                        <td>$${p.sl > 0 ? p.sl.toFixed(4) : '-'}</td>
                        <td>$${p.value.toLocaleString()}</td>
                    </tr>`;
            }).join('');

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Asset</th><th>Side</th><th>Size</th><th>Entry</th><th>Price</th><th>Unrealized P/L</th><th>Stop</th><th>Notional</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>`;
        }

        function renderHistory(history) {
            applyFilters(); // Uses the logic from search input
        }

        function applyFilters() {
            if (!rawData?.strategies?.[currentStrategy]) {
                return;
            }
            const filterText = document.getElementById('symbol-filter').value.toUpperCase();
            const data = rawData.strategies[currentStrategy];
            const filtered = data.trade_history.filter(t => t.symbol.toUpperCase().includes(filterText));

            const container = document.getElementById('history-table-container');
            if (filtered.length === 0) {
                container.innerHTML = '<div style="padding:20px; color:var(--muted); text-align:center;">No trades match your filter.</div>';
                return;
            }

            const tbody = document.createElement('tbody');
            filtered.forEach(t => {
                const badge = t.side === 'LONG' ? 'badge-long' : 'badge-short';
                const pnlColor = t.pnl >= 0 ? 'var(--success-color)' : 'var(--danger-color)';
                const hasChart = t.chart_b64 && t.chart_b64.length > 0;

                const tr = document.createElement('tr');
                tr.className = 'trade-row';
                tr.innerHTML = `
                    <td class="caret-cell">&#9654;</td>
                    <td style="color:var(--muted)">${new Date(t.time).toLocaleDateString()}</td>
                    <td style="font-weight:600">${t.symbol}</td>
                    <td><span class="badge ${badge}">${t.side}</span></td>
                    <td style="color:${pnlColor}">
                        ${t.pnl >= 0 ? '+' : ''}$${t.pnl.toFixed(2)}
                        <span style="font-size:10px; opacity:0.7">(${t.pnl_pct.toFixed(2)}%)</span>
                    </td>
                    <td style="font-size:11px; opacity:0.8">${t.reason}</td>`;

                const detailTr = document.createElement('tr');
                detailTr.className = 'trade-detail-row';
                const inner = document.createElement('div');
                inner.className = 'trade-detail-inner';

                if (hasChart) {
                    inner.innerHTML = `<img src="data:image/png;base64,${t.chart_b64}" class="trade-chart-img">`;
                } else {
                    inner.innerHTML = `<div class="no-chart-msg">Snapshot missing. Trade occurred before system hardening.</div>`;
                }

                detailTr.innerHTML = `<td colspan="6"></td>`;
                detailTr.querySelector('td').appendChild(inner);

                tr.onclick = () => {
                    if (expandedRow && expandedRow !== inner) {
                        expandedRow.classList.remove('open');
                        if (expandedTradeRow) expandedTradeRow.classList.remove('expanded');
                    }
                    inner.classList.toggle('open');
                    tr.classList.toggle('expanded');
                    const isOpen = inner.classList.contains('open');
                    expandedRow = isOpen ? inner : null;
                    expandedTradeRow = isOpen ? tr : null;
                };

                tbody.appendChild(tr);
                tbody.appendChild(detailTr);
            });

            container.innerHTML = '';
            const table = document.createElement('table');
            table.innerHTML = `<thead><tr><th></th><th>Date</th><th>Symbol</th><th>Side</th><th>Realized P/L</th><th>Signal Reason</th></tr></thead>`;
            table.appendChild(tbody);
            container.appendChild(table);
        }

        function renderEquityChart(history) {
            const ctx = document.getElementById('equityChart').getContext('2d');
            if (equityChart) equityChart.destroy();

            const labels = history.map(h => new Date(h.time).toLocaleDateString());
            const values = history.map(h => h.equity);
            const initialPoint = history.find(h => h.type === 'initial');
            const baseline = initialPoint ? initialPoint.equity : (history[0]?.equity ?? 10000);

            equityChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Equity',
                        data: values,
                        borderColor: '#58a6ff',
                        backgroundColor: 'rgba(88, 166, 255, 0.05)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 0
                    }, {
                        label: 'Initial',
                        data: Array(labels.length).fill(baseline),
                        borderColor: 'rgba(139, 148, 158, 0.5)',
                        borderWidth: 1,
                        borderDash: [5, 5],
                        pointRadius: 0,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#8b949e', maxTicksLimit: 10 } },
                        y: { grid: { color: '#30363d' }, ticks: { color: '#8b949e' } }
                    }
                }
            });
        }

        function renderExposureChart(exposure) {
            const ctx = document.getElementById('exposureChart').getContext('2d');
            if (exposureChart) exposureChart.destroy();

            const labels = Object.keys(exposure);
            const values = Object.values(exposure);

            exposureChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: '#58a6ff',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#30363d' }, ticks: { color: '#8b949e' } },
                        y: { grid: { display: false }, ticks: { color: '#8b949e' } }
                    }
                }
            });
        }

        loadData();
    </script>
</body>

</html>
